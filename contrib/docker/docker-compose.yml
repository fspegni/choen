volumes:
    backend_data:

services:

    backend:
        build:
            context: .
            dockerfile: ./contrib/docker/Dockerfile_backend
            args:
                DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME}"
                DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL}"

        volumes:
            - './src:/app/src'  
            - './public:/app/public'  
            - './data/initial:/app/data/initial'
            - 'backend_data:/app/data/persistent'
        env_file:
            - "./contrib/docker/.env"
 
        restart: unless-stopped
        ports:
            - '127.0.0.1:${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}'
        command: [ "django-admin", "runserver", "0.0.0.0:8000" ]
        networks:
            - blockchain


    ganache:
        image: trufflesuite/ganache:latest
        command:
          - --server.host
          - 0.0.0.0
          - --server.port
          - "8545"
          - --wallet.deterministic
          - --chain.chainId
          - "1337"
        ports:
          - "127.0.0.1:8545:8545"
        networks:
          - blockchain
    
networks:
  blockchain:
    driver: bridge
